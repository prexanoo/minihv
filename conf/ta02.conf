; TA-02: 4 VMs CPU-bound com chegadas diferentes, host do escopo (4 pCPUs).
; Com 4 pCPUs cada VM fica numa CPU desde a chegada: despachos em t=0 (a),
; t=2 (b), t=4 (c), t=6 (d), e a cada 5 ticks a mesma VM e preemptada e
; despachada de novo. A versao com 1 pCPU (ta02_1cpu.conf) e mais
; interessante para conferir o CREDIT a mao.

[log]
file = out/ta02.jsonl

[ext]
file = out/ta02_gantt.csv

[vm]
name      = a
program   = progs/cpu_curto.mv
arrival   = 0
priority  = 0

[vm]
name      = b
program   = progs/cpu_curto.mv
arrival   = 2
priority  = 3

[vm]
name      = c
program   = progs/cpu_curto.mv
arrival   = 4
priority  = 6

[vm]
name      = d
program   = progs/cpu_curto.mv
arrival   = 6
priority  = 9
