; TA-02 com 1 pCPU: mesmas 4 VMs, mas disputando a mesma CPU.
; Sequencia de despachos calculada a mao (ver README e tests/test_sched.c):
;  t=0 a, 5 b, 10 c, 15 d, 20 a, 25 b, 30 c, 35 d, 40 a, 45 b,
;  50 a, 55 c, 60 b, 65 a, 68 b, 71 d, 76 c, 81 d, 86 c, 89 d
; fim: a=67 b=70 c=88 d=91

[host]
pcpus = 1

[log]
file = out/ta02_1cpu.jsonl

[ext]
file = out/ta02_1cpu_gantt.csv

[vm]
name      = a
program   = progs/cpu_curto.mv
arrival   = 0
priority  = 0

[vm]
name      = b
program   = progs/cpu_curto.mv
arrival   = 2
priority  = 3

[vm]
name      = c
program   = progs/cpu_curto.mv
arrival   = 4
priority  = 6

[vm]
name      = d
program   = progs/cpu_curto.mv
arrival   = 6
priority  = 9
