; MiniHV - escopo 09
; CREDIT q=5 | 4 pCPUs / 6 VMs | CONT BEST_FIT 4096 | C_LOOK | JSONL | GANTT

[host]
pcpus      = 4
max_vms    = 6
max_ticks  = 5000
seed       = 2026

[sched]
policy     = CREDIT        ; CREDIT (escopo) ou FCFS (referencia)
quantum    = 5

[mem]
model      = CONT
phys_words = 4096
allocation = BEST_FIT
pf_penalty = 3             ; so seria usado no modelo PAG

[io]
disk_algorithm = C_LOOK
disk_cylinders = 200
disk_head      = 50
seek_rate      = 25

[log]
format = JSONL
level  = INFO
file   = out/minihv.jsonl

[ext]
enabled = true
file    = out/gantt.csv

[vm]
name      = web
program   = progs/contador.mv
arrival   = 0
priority  = 2
mem_words = 512

[vm]
name      = calc
program   = progs/cpu_bound.mv
arrival   = 0
priority  = 5
mem_words = 768

[vm]
name      = db
program   = progs/io_pesado.mv
arrival   = 3
priority  = 1
mem_words = 640

[vm]
name      = scan
program   = progs/memoria.mv
arrival   = 5
priority  = 4
mem_words = 1024

[vm]
name      = bug
program   = progs/protecao.mv
arrival   = 8
priority  = 7
mem_words = 256

[vm]
name      = burst
program   = progs/gantt.mv
arrival   = 10
priority  = 3
mem_words = 384

[vm]
name      = calc2
program   = progs/cpu_bound.mv
arrival   = 12
priority  = 8
mem_words = 768
