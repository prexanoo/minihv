; RNF-05: 8 VMs por 10.000 ticks (tem que levar menos de 1 segundo).
; max_vms foi aumentado para 8 so neste arquivo, para as 8 rodarem juntas.
; Todas terminam com MAX_TICKS.

[host]
max_vms   = 8
max_ticks = 10000

[log]
file = out/perf.jsonl

[ext]
file = out/perf_gantt.csv

[vm]
name = l0
program = progs/loop.mv
priority = 0

[vm]
name = l1
program = progs/loop.mv
priority = 1

[vm]
name = l2
program = progs/loop.mv
priority = 2

[vm]
name = l3
program = progs/loop.mv
priority = 3

[vm]
name = io1
program = progs/io_pesado.mv
priority = 4

[vm]
name = l5
program = progs/loop.mv
priority = 5

[vm]
name = l6
program = progs/loop.mv
priority = 6

[vm]
name = l7
program = progs/loop.mv
priority = 9
