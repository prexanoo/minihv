; TA-08 (GANTT): 6 VMs em 4 pCPUs, com rajadas de CPU e E/S.
; O diagrama impresso no fim (e out/ta08_gantt.csv) tem que bater tick a
; tick com os DISPATCH e PREEMPT de out/ta08.jsonl. O teste
; tests/test_ext.c faz essa conferencia automaticamente.

[log]
file = out/ta08.jsonl

[ext]
enabled = true
file    = out/ta08_gantt.csv

[vm]
name      = g1
program   = progs/gantt.mv
arrival   = 0
priority  = 1

[vm]
name      = g2
program   = progs/gantt.mv
arrival   = 0
priority  = 6

[vm]
name      = calc
program   = progs/cpu_bound.mv
arrival   = 0
priority  = 4

[vm]
name      = curto
program   = progs/cpu_curto.mv
arrival   = 3
priority  = 0

[vm]
name      = web
program   = progs/contador.mv
arrival   = 5
priority  = 8

[vm]
name      = calc2
program   = progs/cpu_bound.mv
arrival   = 7
priority  = 9
